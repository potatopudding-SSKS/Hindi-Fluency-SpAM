[project]
name = "hindi-fluency-spam"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aksharamukha>=2.3",
    "epitran>=1.35.2",
    "fasttext>=0.9.3",
    "gensim",
    "indic-transliteration>=2.3.82",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymongo>=4.18.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.uv.sources]
# gensim 4.4.0 has no Python 3.14 wheels, and its PyPI sdist ships C files generated by an old
# Cython that do not compile on 3.14. The tagged GitHub source contains only the .pyx files,
# so the build regenerates them with Cython >= 3.1.3 (gensim's own build requirement).
gensim = { url = "https://github.com/piskvorky/gensim/archive/refs/tags/4.4.0.tar.gz" }

# graph-tool (Analyses, section 2) is not on PyPI. It comes from the system package, so the venv
# must see system site-packages:  uv venv --python /usr/bin/python3.14 --system-site-packages
